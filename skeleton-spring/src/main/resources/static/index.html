<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EuroCart</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f6f6f6; color: #222; }
    h1 { margin: 0 0 1rem; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    section { background: #fff; border-radius: 8px; padding: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    h2 { margin: 0 0 .5rem; font-size: 1.1rem; }
    h3 { margin: 1rem 0 .25rem; font-size: .9rem; text-transform: uppercase; color: #666; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: .3rem .4rem; text-align: left; border-bottom: 1px solid #eee; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    button { cursor: pointer; border: 1px solid #999; background: #fafafa; border-radius: 4px; padding: .15rem .5rem; }
    button:hover { background: #eee; }
    tfoot td { font-weight: bold; border-top: 2px solid #ccc; }
    .muted { color: #888; font-size: .85rem; }
    #error { color: #b00; min-height: 1.2em; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1rem; margin-bottom: 1rem; }
    header h1 { margin: 0; }
    form { margin-top: 1rem; }
    fieldset { border: 1px solid #ddd; border-radius: 4px; margin: 0 0 .75rem; padding: .5rem .75rem; }
    legend { font-size: .85rem; color: #666; }
    label { display: block; margin: .4rem 0 0; font-size: .85rem; color: #444; }
    input, select { width: 100%; box-sizing: border-box; padding: .3rem .4rem; border: 1px solid #bbb; border-radius: 4px; font: inherit; }
    .row { display: grid; grid-template-columns: 2fr 1fr; gap: .5rem; }
    [hidden] { display: none !important; }
    header label { display: inline; margin: 0; font-size: 1rem; color: inherit; }
    header select { width: auto; padding: .15rem .3rem; }
  </style>
</head>
<body>
  <header>
    <h1>EuroCart</h1>
    <label>Storefront <select id="storefront"></select></label>
  </header>
  <p id="error"></p>
  <main>
    <section>
      <h2>Products</h2>
      <p class="muted" id="price-note"></p>
      <div id="products"></div>
    </section>
    <section>
      <h2>Cart</h2>
      <table>
        <thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Excl. VAT</th><th class="num">VAT</th><th class="num">Incl. VAT</th><th></th></tr></thead>
        <tbody id="cart-lines"></tbody>
        <tfoot>
          <tr><td colspan="2">Shipping (excl. VAT)</td><td class="num" id="shipping" colspan="3">–</td><td></td></tr>
          <tr><td colspan="2">Subtotal (excl. VAT)</td><td class="num" id="subtotal" colspan="3"></td><td></td></tr>
          <tr><td colspan="2">VAT</td><td class="num" id="vat-total" colspan="3"></td><td></td></tr>
          <tr><td colspan="2">Total (incl. VAT)</td><td class="num" id="total" colspan="3"></td><td></td></tr>
        </tfoot>
      </table>
      <p><button id="checkout">Checkout</button></p>

      <form id="order-form" hidden>
        <fieldset>
          <legend>Contact</legend>
          <label>Email <input name="email" type="email" autocomplete="email" required></label>
        </fieldset>
        <fieldset id="shipping-fields">
          <legend>Shipping address</legend>
          <label>Full name <input name="fullName" autocomplete="name"></label>
          <div class="row">
            <label>Street <input name="street" autocomplete="address-line1"></label>
            <label>House number <input name="houseNumber"></label>
          </div>
          <div class="row">
            <label>Postal code <input name="postalCode" placeholder="00-950" autocomplete="postal-code"></label>
            <label>City <input name="city" autocomplete="address-level2"></label>
          </div>
          <label>Country
            <select name="country"><option value="PL" selected>Poland</option></select>
          </label>
          <label>Phone (optional) <input name="phone" type="tel" autocomplete="tel"></label>
        </fieldset>
        <p class="muted" id="digital-note" hidden>Only digital products in your cart: no shipping address needed.</p>
        <button type="submit">Pay with PayPal</button>
      </form>
      <p id="payment-status"></p>
    </section>
  </main>

  <script>
    // All amounts come from the backend PricingService, already converted to the currency of the storefront and
    // including the VAT of its country. The backend lists the storefronts; this only adds how to show them.
    const STOREFRONT_LABELS = {
      NL: { name: 'Nederland', locale: 'nl-NL', vat: 'Dutch VAT' },
      DE: { name: 'Deutschland', locale: 'de-DE', vat: 'German VAT' },
      FR: { name: 'France', locale: 'fr-FR', vat: 'French VAT' },
      PL: { name: 'Polska', locale: 'pl-PL', vat: 'Polish VAT' },
      CH: { name: 'Schweiz', locale: 'de-CH', vat: 'Swiss VAT' },
      GB: { name: 'United Kingdom', locale: 'en-GB', vat: 'UK VAT' }
    };
    const DEFAULT_COUNTRY = 'PL';
    const storefrontSelect = document.getElementById('storefront');
    let storefront = { country: DEFAULT_COUNTRY, currency: 'PLN' };
    let moneyFormat;
    const formatMoney = amount => moneyFormat.format(amount);
    const errorEl = document.getElementById('error');

    function rememberedCountry() {
      try { return localStorage.getItem('eurocart.storefront') || DEFAULT_COUNTRY; } catch { return DEFAULT_COUNTRY; }
    }

    function rememberCountry(country) {
      try { localStorage.setItem('eurocart.storefront', country); } catch { /* not remembered, still works */ }
    }

    function useStorefront(next) {
      storefront = next;
      const label = STOREFRONT_LABELS[next.country];
      moneyFormat = new Intl.NumberFormat(label.locale, { style: 'currency', currency: next.currency });
      document.getElementById('price-note').textContent =
          `Prices in ${next.currency}, including ${label.vat}. Shipping is added per order for physical products.`;
    }

    async function api(path, options) {
      errorEl.textContent = '';
      const response = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
      const body = await response.json().catch(() => null);
      if (!response.ok) {
        errorEl.textContent = (body && body.detail) || `${response.status} ${response.statusText}`;
        throw new Error(errorEl.textContent);
      }
      return body;
    }

    function renderProducts(products, prices) {
      const byCategory = Map.groupBy(products, p => p.category);
      const container = document.getElementById('products');
      container.innerHTML = '';
      for (const [category, items] of byCategory) {
        const heading = document.createElement('h3');
        heading.textContent = category;
        container.appendChild(heading);
        const table = document.createElement('table');
        for (const p of items) {
          const row = table.insertRow();
          row.insertCell().textContent = p.name;
          row.insertCell().innerHTML = `<span class="muted">${p.countryOfOrigin}</span>`;
          const price = row.insertCell(); price.className = 'num';
          price.textContent = formatMoney(prices[p.id].gross);
          const action = row.insertCell(); action.className = 'num';
          const button = document.createElement('button');
          button.textContent = 'Add';
          button.onclick = () => addToCart(p.id);
          action.appendChild(button);
        }
        container.appendChild(table);
      }
    }

    function renderCart(cart) {
      const tbody = document.getElementById('cart-lines');
      tbody.innerHTML = '';
      for (const line of cart.lines) {
        const row = tbody.insertRow();
        row.insertCell().textContent = line.product.name;
        const qty = row.insertCell(); qty.className = 'num'; qty.textContent = line.quantity;
        const { vatPercent, net, vat, gross } = line.price;
        const excl = row.insertCell(); excl.className = 'num'; excl.textContent = formatMoney(net);
        const vatCell = row.insertCell(); vatCell.className = 'num'; vatCell.textContent = `${formatMoney(vat)} (${vatPercent}%)`;
        const incl = row.insertCell(); incl.className = 'num'; incl.textContent = formatMoney(gross);
        const action = row.insertCell(); action.className = 'num';
        const button = document.createElement('button');
        button.textContent = 'Remove';
        button.onclick = () => removeFromCart(line.product.id);
        action.appendChild(button);
      }
      document.getElementById('shipping').textContent = cart.shipping ? formatMoney(cart.shipping.net) : '–';
      document.getElementById('subtotal').textContent = formatMoney(cart.net);
      document.getElementById('vat-total').textContent = formatMoney(cart.vat);
      document.getElementById('total').textContent = formatMoney(cart.gross);
    }

    // The cart endpoints change the cart; the priced cart is always read from the pricing endpoint of the storefront.
    const pricingPath = path => `/api/pricing/${path}?country=${storefront.country}`;
    const refreshCart = async () => renderCart(await api(pricingPath('cart')));

    async function addToCart(productId) {
      await api('/api/cart/items', { method: 'POST', body: JSON.stringify({ productId, quantity: 1 }) });
      await refreshCart();
    }

    async function removeFromCart(productId) {
      await api(`/api/cart/items/${productId}`, { method: 'DELETE' });
      await refreshCart();
    }

    const statusEl = document.getElementById('payment-status');
    const orderForm = document.getElementById('order-form');

    // Step 1: show the contact / shipping form. Shipping is only needed when the cart has physical products.
    document.getElementById('checkout').onclick = async () => {
      statusEl.textContent = '';
      const cart = await api(pricingPath('cart'));
      if (cart.lines.length === 0) {
        errorEl.textContent = 'Your cart is empty.';
        return;
      }
      const physical = cart.lines.some(line => line.product.category !== 'EBOOK');
      document.getElementById('shipping-fields').hidden = !physical;
      document.getElementById('digital-note').hidden = physical;
      orderForm.dataset.physical = physical;
      orderForm.hidden = false;
      orderForm.elements.email.focus();
    };

    // Step 2: save the order (status PENDING, price snapshot) and go to the simulated PayPal page for that order.
    orderForm.onsubmit = async event => {
      event.preventDefault();
      const field = name => orderForm.elements[name].value;
      const shipping = orderForm.dataset.physical === 'true'
        ? Object.fromEntries(['fullName', 'street', 'houseNumber', 'postalCode', 'city', 'country', 'phone']
            .map(name => [name, field(name)]))
        : null;
      const order = await api('/api/orders', { method: 'POST',
          body: JSON.stringify({ email: field('email'), shipping, storefront: storefront.country }) });
      location.href = `/paypal-simulator.html?order=${encodeURIComponent(order.id)}`;
    };

    // Back from the simulated PayPal page.
    const returned = new URLSearchParams(location.search);
    if (returned.has('paid')) {
      statusEl.textContent = `Payment completed. Order ${returned.get('paid')} is paid. Thank you!`;
    } else if (returned.has('cancelled')) {
      statusEl.textContent = `Payment cancelled. Order ${returned.get('cancelled')} is saved but not paid; your cart is unchanged.`;
    }
    if (returned.size) history.replaceState(null, '', location.pathname);

    let products = [];
    let storefronts = [];

    async function showStorefront(country) {
      useStorefront(storefronts.find(s => s.country === country) || storefronts.find(s => s.country === DEFAULT_COUNTRY));
      storefrontSelect.value = storefront.country;
      rememberCountry(storefront.country);
      renderProducts(products, await api(pricingPath('products')));
      await refreshCart();
    }

    // The checkout form is filled in for one storefront: start it again in the new one.
    storefrontSelect.onchange = () => {
      statusEl.textContent = '';
      orderForm.hidden = true;
      showStorefront(storefrontSelect.value);
    };

    Promise.all([api('/api/products'), api('/api/pricing/storefronts')])
      .then(([allProducts, allStorefronts]) => {
        products = allProducts;
        storefronts = allStorefronts;
        for (const s of storefronts) {
          const label = STOREFRONT_LABELS[s.country];
          storefrontSelect.add(new Option(`${label ? label.name : s.country} (${s.currency})`, s.country));
        }
        return showStorefront(rememberedCountry());
      });
  </script>
</body>
</html>
