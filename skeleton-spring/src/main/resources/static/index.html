<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EuroCart</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f6f6f6; color: #222; }
    h1 { margin: 0 0 1rem; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    section { background: #fff; border-radius: 8px; padding: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    h2 { margin: 0 0 .5rem; font-size: 1.1rem; }
    h3 { margin: 1rem 0 .25rem; font-size: .9rem; text-transform: uppercase; color: #666; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: .3rem .4rem; text-align: left; border-bottom: 1px solid #eee; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    button { cursor: pointer; border: 1px solid #999; background: #fafafa; border-radius: 4px; padding: .15rem .5rem; }
    button:hover { background: #eee; }
    tfoot td { font-weight: bold; border-top: 2px solid #ccc; }
    .muted { color: #888; font-size: .85rem; }
    #error { color: #b00; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>EuroCart</h1>
  <p id="error"></p>
  <main>
    <section>
      <h2>Products</h2>
      <p class="muted">Prices in PLN, including Polish VAT, excluding shipping.</p>
      <div id="products"></div>
    </section>
    <section>
      <h2>Cart</h2>
      <table>
        <thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Excl. VAT</th><th class="num">VAT</th><th class="num">Incl. VAT</th><th></th></tr></thead>
        <tbody id="cart-lines"></tbody>
        <tfoot>
          <tr><td colspan="2">Subtotal (excl. VAT)</td><td class="num" id="subtotal" colspan="3">0,00 zł</td><td></td></tr>
          <tr><td colspan="2">VAT</td><td class="num" id="vat-total" colspan="3">0,00 zł</td><td></td></tr>
          <tr><td colspan="2">Total (incl. VAT)</td><td class="num" id="total" colspan="3">0,00 zł</td><td></td></tr>
        </tfoot>
      </table>
      <p><button id="checkout">Checkout</button> <button id="clear">Empty cart</button></p>
      <div id="paypal-buttons"></div>
      <p id="payment-status"></p>
    </section>
  </main>

  <script>
    // All amounts come from the backend PricingService, already converted to PLN and including VAT.
    const plnFormat = new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN' });
    const formatPln = amount => plnFormat.format(amount);
    const errorEl = document.getElementById('error');

    async function api(path, options) {
      errorEl.textContent = '';
      const response = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
      const body = await response.json().catch(() => null);
      if (!response.ok) {
        errorEl.textContent = (body && body.detail) || `${response.status} ${response.statusText}`;
        throw new Error(errorEl.textContent);
      }
      return body;
    }

    function renderProducts(products, prices) {
      const byCategory = Map.groupBy(products, p => p.category);
      const container = document.getElementById('products');
      container.innerHTML = '';
      for (const [category, items] of byCategory) {
        const heading = document.createElement('h3');
        heading.textContent = category;
        container.appendChild(heading);
        const table = document.createElement('table');
        for (const p of items) {
          const row = table.insertRow();
          row.insertCell().textContent = p.name;
          row.insertCell().innerHTML = `<span class="muted">${p.countryOfOrigin}</span>`;
          const price = row.insertCell(); price.className = 'num';
          price.textContent = formatPln(prices[p.id].gross);
          const action = row.insertCell(); action.className = 'num';
          const button = document.createElement('button');
          button.textContent = 'Add';
          button.onclick = () => addToCart(p.id);
          action.appendChild(button);
        }
        container.appendChild(table);
      }
    }

    function renderCart(cart) {
      const tbody = document.getElementById('cart-lines');
      tbody.innerHTML = '';
      for (const line of cart.lines) {
        const row = tbody.insertRow();
        row.insertCell().textContent = line.product.name;
        const qty = row.insertCell(); qty.className = 'num'; qty.textContent = line.quantity;
        const { vatPercent, net, vat, gross } = line.price;
        const excl = row.insertCell(); excl.className = 'num'; excl.textContent = formatPln(net);
        const vatCell = row.insertCell(); vatCell.className = 'num'; vatCell.textContent = `${formatPln(vat)} (${vatPercent}%)`;
        const incl = row.insertCell(); incl.className = 'num'; incl.textContent = formatPln(gross);
        const action = row.insertCell(); action.className = 'num';
        const button = document.createElement('button');
        button.textContent = 'Remove';
        button.onclick = () => removeFromCart(line.product.id);
        action.appendChild(button);
      }
      document.getElementById('subtotal').textContent = formatPln(cart.net);
      document.getElementById('vat-total').textContent = formatPln(cart.vat);
      document.getElementById('total').textContent = formatPln(cart.gross);
    }

    // The cart endpoints change the cart; the priced cart (PLN, VAT) is always read from the pricing endpoint.
    const refreshCart = async () => renderCart(await api('/api/pricing/cart'));

    async function addToCart(productId) {
      await api('/api/cart/items', { method: 'POST', body: JSON.stringify({ productId, quantity: 1 }) });
      await refreshCart();
    }

    async function removeFromCart(productId) {
      await api(`/api/cart/items/${productId}`, { method: 'DELETE' });
      await refreshCart();
    }

    document.getElementById('clear').onclick = async () => {
      await api('/api/cart', { method: 'DELETE' });
      await refreshCart();
    };

    // First form of payment: PayPal Smart Buttons in the PayPal sandbox (client-id "sb" is PayPal's public test id).
    // Replace it with our own sandbox/live client id before going live.
    const PAYPAL_SDK = 'https://www.paypal.com/sdk/js?client-id=sb&currency=PLN&intent=capture';
    const statusEl = document.getElementById('payment-status');
    let paypalButtonsRendered = false;

    function loadPaypalSdk() {
      if (window.paypal) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = PAYPAL_SDK;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Could not load PayPal'));
        document.head.appendChild(script);
      });
    }

    document.getElementById('checkout').onclick = async () => {
      statusEl.textContent = '';
      const cart = await api('/api/pricing/cart');
      if (cart.lines.length === 0) {
        errorEl.textContent = 'Your cart is empty.';
        return;
      }
      try {
        await loadPaypalSdk();
      } catch (e) {
        errorEl.textContent = e.message;
        return;
      }
      if (paypalButtonsRendered) return;
      paypalButtonsRendered = true;
      paypal.Buttons({
        // The amount is read from the server's priced cart (incl. VAT) at the moment the buyer clicks.
        createOrder: async (data, actions) => {
          const current = await api('/api/pricing/cart');
          const value = current.gross.toFixed(2);
          return actions.order.create({ purchase_units: [{ amount: { currency_code: 'PLN', value } }] });
        },
        onApprove: async (data, actions) => {
          const order = await actions.order.capture();
          statusEl.textContent = `Payment completed. Order ${order.id}. Thank you!`;
          await api('/api/cart', { method: 'DELETE' });
          await refreshCart();
        },
        onError: err => { errorEl.textContent = 'Payment failed: ' + err; }
      }).render('#paypal-buttons');
    };

    Promise.all([api('/api/products'), api('/api/pricing/products')])
      .then(([products, prices]) => renderProducts(products, prices));
    refreshCart();
  </script>
</body>
</html>
